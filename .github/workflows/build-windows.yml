name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-python-pip
            mingw-w64-clang-x86_64-python-pillow
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build and package
        shell: msys2 {0}
        env:
          BB_LTO: OFF
        run: |
          export MSYS2_ROOT="$(cygpath -m /)"
          export WINPYTHON=/clang64/bin/python.exe
          python -m pip install --break-system-packages pyinstaller
          grep -rl 'std::abort' gpu/third_party/sirit | xargs -r sed -i 's/std::abort/abort/g'
          sed -i 's/static int common_initialized;/static int common_initialized __attribute__((unused));/' src/runtime_services.c
          sed -i 's/ -Werror//g' build.sh gpu/CMakeLists.txt gpu/third_party/sirit/CMakeLists.txt
          bash build.sh
          bash packaging/windows/package_sotc.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SotC-PC
          path: dist/SotC-PC.zip
